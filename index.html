    <!-- Prevent Theme Flash Before React Mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
